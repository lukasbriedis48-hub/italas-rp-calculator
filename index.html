
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITALAS RP Calculator</title>
<style>
body{margin:0;background:#0d0b16;color:white;font-family:Arial,sans-serif;padding:25px}
main{max-width:800px;margin:auto;background:#171224;padding:25px;border-radius:18px}
h1{color:#c084fc}
.upload{padding:20px;border:2px dashed #8754c7;border-radius:12px;margin:20px 0}
input[type=file]{max-width:100%}
#preview{max-width:100%;max-height:350px;display:none;margin-top:15px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.item{background:#29203b;padding:15px;border-radius:12px}
.item input{box-sizing:border-box;width:100%;padding:12px;background:#120e1d;border:1px solid #8754c7;color:white;border-radius:8px;margin-top:10px;font-size:17px}
.total{margin-top:20px;padding:20px;background:#38254e;border-radius:12px;font-size:25px;font-weight:bold}
button{background:#9333ea;color:white;border:0;border-radius:9px;padding:12px 20px;margin-top:15px;cursor:pointer}
small{color:#c5b6d7}
</style>
</head>
<body>
<main>
<h1>💜 ITALAS RP Calculator</h1>
<p>FiveM RP inventoriaus skaičiuoklė</p>
<div class="upload">
<label for="photo">Įkelti inventoriaus nuotrauką</label>
<p><input type="file" id="photo" accept="image/*"></p>
<img id="preview" alt="Inventoriaus nuotrauka">
<p><small>Peržiūrėk nuotrauką ir įrašyk prekių kiekius.</small></p>
</div>
<div class="grid" id="items"></div>
<div class="total">Bendra suma: <span id="total">0 €</span></div>
<button onclick="clearAll()">Išvalyti</button>
</main>
<script>
const products=[
["lemon_haze_pack",1700],
["gorila_glue_pack",2000],
["zkittlez_pack",2200],
["purple_punch_pack",3000],
["runtz_pack",3600],
["coke",5000]
];
const items=document.getElementById("items");
products.forEach(([name,price],i)=>{
const div=document.createElement("div");
div.className="item";
const label=document.createElement("label");
label.textContent=name+" — "+price.toLocaleString("lt-LT")+" €";
const input=document.createElement("input");
input.type="number";input.min="0";input.step="1";
input.value="0";input.id="qty"+i;
input.addEventListener("input",calculate);
div.append(label,input);
items.appendChild(div);
});
function calculate(){
let sum=0;
products.forEach(([name,price],i)=>{
const qty=Math.max(0,Number(document.getElementById("qty"+i).value)||0);
sum+=qty*price;
});
document.getElementById("total").textContent=sum.toLocaleString("lt-LT")+" €";
}
function clearAll(){
products.forEach((p,i)=>document.getElementById("qty"+i).value=0);
calculate();
}
document.getElementById("photo").addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
const img=document.getElementById("preview");
img.src=URL.createObjectURL(file);
img.style.display="block";
});
</script>
</body>
</html>

<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiveM RP | Skaičiuoklė</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f4f0ff;background:#0d0b15}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#382064 0,transparent 35%),#0d0b15}.wrap{max-width:950px;margin:0 auto;padding:45px 18px}header{display:flex;align-items:center;gap:14px;margin-bottom:28px}.logo{background:linear-gradient(135deg,#a855f7,#6d28d9);padding:15px;border-radius:18px;font-size:26px;box-shadow:0 8px 40px #8b5cf650}h1{margin:0;font-size:clamp(26px,5vw,39px)}p{color:#a9a1ba;margin:7px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#191426;border:1px solid #382b50;border-radius:20px;padding:25px;box-shadow:0 16px 40px #0003}h2{font-size:19px;margin:0 0 20px}label{display:block;color:#cfc6df;font-size:14px;margin:16px 0 7px}input,select{width:100%;padding:13px 14px;background:#100d1b;color:white;border:1px solid #51416a;border-radius:11px;font:inherit;outline:none}input:focus,select:focus{border-color:#b37aff;box-shadow:0 0 0 3px #9b5cf626}.result{padding:15px 0;border-bottom:1px solid #392e4b;display:flex;justify-content:space-between;gap:12px}.result span{color:#bcb2cf}.result strong{font-variant-numeric:tabular-nums}.hero{background:linear-gradient(135deg,#5c259a,#2c1850);padding:24px;border-radius:15px;margin-bottom:12px}.hero small{color:#ddd0f2}.hero b{display:block;font-size:clamp(28px,5vw,40px);margin-top:8px;color:#e5c9ff}button{border:0;border-radius:11px;padding:13px 17px;background:#8b5cf6;color:white;font-weight:700;cursor:pointer;margin-top:20px;width:100%}button:hover{background:#a477ff}.note{font-size:12px;margin-top:18px}@media(max-width:700px){.layout{grid-template-columns:1fr}.wrap{padding-top:25px}}</style></head><body><main class="wrap"><header><div class="logo">🎮</div><div><h1>FiveM RP skaičiuoklė</h1><p>Žaidimo prekių pajamos, išlaidos ir pelno dalybos</p></div></header><div class="layout"><section class="panel"><h2>⚙️ Skaičiavimo nustatymai</h2><label for="item">RP prekė</label><select id="item"><option value="lemon_haze_pack">lemon_haze_pack</option><option value="gorila_glue_pack">gorila_glue_pack</option><option value="zkittlez_pack">zkittlez_pack</option><option value="purple_punch_pack">purple_punch_pack</option><option value="runtz_pack">runtz_pack</option><option value="coke">coke</option></select><label for="qty">Kiekis (vnt.)</label><input id="qty" type="number" min="0" step="1" value="100"><label for="price">Pardavimo kaina už vienetą (€)</label><input id="price" type="number" min="0" value="1700"><label for="cost">Savikaina už vienetą (€)</label><input id="cost" type="number" min="0" value="0"><label for="members">Gaujos narių skaičius</label><input id="members" type="number" min="1" step="1" value="4"><button id="reset">Atstatyti reikšmes</button></section><section class="panel"><h2>📊 Rezultatai</h2><div class="hero"><small>BENDRAS RP PELNAS</small><b id="profit">0 €</b></div><div class="result"><span>Pajamos</span><strong id="revenue">0 €</strong></div><div class="result"><span>Išlaidos</span><strong id="expenses">0 €</strong></div><div class="result"><span>Pelno marža</span><strong id="margin">0 %</strong></div><div class="result"><span>Pelnas vienam nariui</span><strong id="share">0 €</strong></div><button id="copy">📋 Kopijuoti rezultatus</button><p class="note">Skirta tik FiveM vaidmenų žaidimo ekonomikai. Valiuta – virtualūs žaidimo eurai.</p></section></div></main><script>const prices={lemon_haze_pack:1700,gorila_glue_pack:2000,zkittlez_pack:2200,purple_punch_pack:3000,runtz_pack:3600,coke:5000};const ids=['qty','price','cost','members','item'];const el=id=>document.getElementById(id);const num=id=>Math.max(0,Number(el(id).value)||0);const money=x=>x.toLocaleString('lt-LT',{maximumFractionDigits:2})+' €';function calc(){const revenue=num('qty')*num('price'),expenses=num('qty')*num('cost'),profit=revenue-expenses,members=Math.floor(num('members'));el('revenue').textContent=money(revenue);el('expenses').textContent=money(expenses);el('profit').textContent=money(profit);el('profit').style.color=profit<0?'#ff9fba':'#e5c9ff';el('margin').textContent=revenue?(profit/revenue*100).toFixed(1)+' %':'0 %';el('share').textContent=members?money(profit/members):'—';localStorage.setItem('fivem-calc',JSON.stringify(Object.fromEntries(ids.map(id=>[id,el(id).value]))))}try{const saved=JSON.parse(localStorage.getItem('fivem-calc')||'{}');ids.forEach(id=>{if(saved[id]!==undefined)el(id).value=saved[id]});if(!prices[el('item').value]){el('item').value='lemon_haze_pack';el('price').value=1700}}catch{}ids.forEach(id=>el(id).addEventListener('input',calc));el('item').addEventListener('change',()=>{el('price').value=prices[el('item').value]||0;calc()});el('reset').onclick=()=>{Object.entries({qty:100,price:1700,cost:0,members:4,item:'lemon_haze_pack'}).forEach(([id,value])=>el(id).value=value);calc()};el('copy').onclick=async()=>{const data=`FiveM RP – ${el('item').value}\nKiekis: ${el('qty').value}\nPajamos: ${el('revenue').textContent}\nIšlaidos: ${el('expenses').textContent}\nPelnas: ${el('profit').textContent}\nVienam nariui: ${el('share').textContent}`;try{await navigator.clipboard.writeText(data);el('copy').textContent='✓ Nukopijuota!';setTimeout(()=>el('copy').textContent='📋 Kopijuoti rezultatus',1600)}catch{prompt('Nukopijuok rezultatus:',data)}};calc();</script></body></html>
